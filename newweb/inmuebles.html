    <!-- Scripts -->

    <script>
      function toggleDropdown(id) {
        const current = document.getElementById("dropdown-" + id);

        // Cerrar cualquier otro dropdown abierto
        document
          .querySelectorAll(".multiselect-options")
          .forEach((dropdown) => {
            if (dropdown !== current) {
              dropdown.style.display = "none";
            }
          });

        // Toggle actual
        current.style.display =
          current.style.display === "block" ? "none" : "block";
      }

      // Cerrar todos los dropdowns si se hace clic afuera
      document.addEventListener("click", function (event) {
        const isMultiselect = event.target.closest(".multiselect-wrapper");
        if (!isMultiselect) {
          document
            .querySelectorAll(".multiselect-options")
            .forEach((dropdown) => {
              dropdown.style.display = "none";
            });
        }
      });
    </script>
