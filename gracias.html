<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>
      NDB Propiedades | Tasaciones en Zona Norte
    </title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
      <link
      rel="icon"
      href="assets/img/favicon/favicon.ico"
      type="image/x-icon"
    />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f5f5f5;
      color: #333;
      text-align: center;
      padding: 4rem 1rem;
    }

    .gracias-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 3rem 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 2rem;
      color: #0e246a;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .countdown {
      font-weight: bold;
      color: #0e246a;
    }

    .volver {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      background-color: #0e246a;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .volver:hover {
      background-color: #2d9587;
    }
  </style>
</head>
<body>

  <div class="gracias-container">
    <h1>¡Gracias por tu mensaje!</h1>
    <p>Nos pondremos en contacto muy pronto.</p>
    <p>Serás redirigido a la página principal en <span class="countdown" id="count">5</span> segundos.</p>
    <a href="index.html" class="volver">Volver ahora</a>
  </div>

  <script>
    let segundos = 5;
    const countSpan = document.getElementById('count');

    const interval = setInterval(() => {
      segundos--;
      countSpan.textContent = segundos;

      if (segundos <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>

</body>
</html>
